name: Quint (advisory)
on:
  pull_request:
    paths:
      - 'spec/**'
      - 'src/scheduler/**'
      - 'src/budget/**'
      - 'src/domain.rs'
      - 'src/github/**'
      - 'src/config.rs'
      - 'src/projects.rs'
      - 'src/routing.rs'
      - 'tests/routing.rs'
      - 'src/cli/commands/project.rs'
      - 'tests/projects.rs'
      - 'tests/fixtures/**'
      - 'src/store/**'
      - 'tests/e2e_daemon.rs'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/spec.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quint:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: spec/package-lock.json
      - run: npm ci --prefix spec --ignore-scripts
      - run: npm --prefix spec run typecheck
      - run: npm --prefix spec test
      - run: spec/node_modules/.bin/quint test spec/powerqueue.qnt --main=progress
      - run: npm --prefix spec run check
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust replay projection and Quint rejection schedules
        run: cargo test --example quint-replay -- --include-ignored
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Collect real daemon traces
        env:
          POWERQUEUE_TRACE_DIR: ${{ runner.temp }}/pq-traces
          POWERQUEUE_SECRETS: file
        run: |
          cargo test --test e2e_daemon task_runs_to_completion_with_usage_and_cleanup
          cargo test --test e2e_daemon crashed_session_is_resumed_and_completes
          cargo test --test e2e_daemon codex_rate_limit_puts_provider_on_cooldown
          cargo test --test e2e_daemon github_issue_runs_to_completion_and_closes
          cargo test --test e2e_daemon review_hand_off_frees_the_slot_and_a_conflict_resumes_the_same_session
          cargo test --test e2e_daemon closed_review_resumes_watching_without_launching_an_agent
      - name: Replay every required trace (missing artifacts fail)
        run: |
          for name in completion crash-resume rate-limit github-approved review-round review-closed-resume; do
            cargo run --quiet --example quint-replay -- "$RUNNER_TEMP/pq-traces/$name.json" --name "$name" --run
          done
      - name: Require complete review lifecycle coverage
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          required = {
              "review-round": {"HandOff": 3, "ReviewRelease": 3, "ReviewRetry": 1, "Launch": 3, "Merge": 1},
              "review-closed-resume": {"HandOff": 1, "ReviewRelease": 1, "ReviewPark": 1, "Resume": 1, "Launch": 1, "Merge": 1},
          }
          for name, actions in required.items():
              report = json.loads(Path(f"spec/.generated/{name}.coverage.json").read_text())
              assert not report["truncated_or_skipped_tasks"], (name, report)
              for action, minimum in actions.items():
                  assert report["actions"].get(action, 0) >= minimum, (name, action, report)
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: quint-traces
          include-hidden-files: true
          path: |
            spec/.generated/*.itf.json
            spec/.generated/*.coverage.json
            spec/.generated/*.qnt
          if-no-files-found: ignore
