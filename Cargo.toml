[package]
name = "powerqueue"
version = "0.4.2"
edition = "2024"
rust-version = "1.88"
description = "Get the most out of your Claude subscription: an autonomous work queue that turns Linear tickets into Claude Code sessions on a cheap VPS or your laptop, with budget pacing, crash recovery and usage learning"
license = "MIT"
repository = "https://github.com/aleandros/powerqueue"
homepage = "https://aleandros.github.io/powerqueue/"
documentation = "https://github.com/aleandros/powerqueue#readme"
readme = "README.md"
keywords = ["claude", "linear", "tmux", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".claude/", "docs/reference/", "justfile"]

[[bin]]
name = "powerqueue"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind": the dashboard installs a panic hook that restores the
# terminal before the message is printed.

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
crossterm = "0.29.0"
dialoguer = "0.12.0"
directories = "6.0.0"
fd-lock = "4.0.4"
flate2 = "1.1.10"
humantime = "2.4.0"
indicatif = "0.18.6"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store", "windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
notify = "8.2.0"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
shlex = "2.0.1"
similar = "2"
sysinfo = "0.39.6"
tar = "0.4.44"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
which = "8.0.6"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
wiremock = "0.6.5"
